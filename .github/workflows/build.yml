name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - { compiler: g++, config: Debug }
          - { compiler: clang++, config: Release }
    steps:
      - uses: actions/checkout@v4
      - name: Install build prerequisites on CI runner
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libvulkan-dev glslc libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libwayland-dev libxkbcommon-dev wayland-protocols libdecor-0-dev
      - name: Configure pinned dependencies
        run: cmake -S . -B build/ci -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.config }} -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
      - name: Build
        run: cmake --build build/ci --parallel 4
      - name: CPU and CLI tests (no display required)
        run: ctest --test-dir build/ci --output-on-failure
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Vulkan SDK on CI runner
        shell: pwsh
        run: |
          $sdkVersion = '1.3.296.0'
          $installer = "$env:RUNNER_TEMP\VulkanSDK-Installer.exe"
          $sdkRoot = "$env:RUNNER_TEMP\VulkanSDK"
          Invoke-WebRequest "https://sdk.lunarg.com/sdk/download/$sdkVersion/windows/VulkanSDK-$sdkVersion-Installer.exe" -OutFile $installer
          $process = Start-Process -FilePath $installer -ArgumentList @('--root', $sdkRoot, '--accept-licenses', '--default-answer', '--confirm-command', 'install', 'copy_only=1') -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Vulkan SDK installer failed: $($process.ExitCode)" }
          "VULKAN_SDK=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "$sdkRoot\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Configure MSVC x64
        run: cmake -S . -B build/ci -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build/ci --config Release --parallel 4
      - name: CPU and CLI tests
        run: ctest --test-dir build/ci -C Release --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: voxelcraft-windows-unverified-runtime
          path: build/ci/bin/Release/
