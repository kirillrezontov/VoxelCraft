name: Optional Vulkan validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  graphics:
    # Explicit manual dispatch on a maintained GPU/display runner. Ordinary
    # hosted CI never assumes a graphics device or installs a replacement backend.
    runs-on: [self-hosted, linux, vulkan]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: cmake --preset graphics
      - run: cmake --build --preset graphics --parallel 4
      - run: ctest --preset graphics
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vulkan-validation-captures
          path: |
            build/graphics/*.ppm
            build/graphics/ui-console-captures/*.ppm
            build/graphics/Testing/Temporary/LastTest.log
