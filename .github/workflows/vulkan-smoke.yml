name: Optional Vulkan validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  graphics:
    # Explicit manual dispatch on a maintained GPU/display runner. Ordinary
    # hosted CI never assumes a graphics device or installs a replacement backend.
    runs-on: [self-hosted, linux, vulkan]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Checkout explicit VoxelUI 0.2.1 source
        uses: actions/checkout@v4
        with:
          repository: kirillrezontov/VoxelUI
          ref: 8e6b3e3dc311cf2b6cfbc2cd667c668d60994f95
          path: dependencies/VoxelUI
      - run: cmake --preset graphics -DVC_ENABLE_VOXELUI=ON -DVC_VOXELUI_SOURCE_DIR:STRING=${{ github.workspace }}/dependencies/VoxelUI
      - run: cmake --build --preset graphics --parallel 4
      - run: ctest --preset graphics
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vulkan-validation-captures
          path: |
            build/graphics/*.ppm
            build/graphics/ui-console-captures/*.ppm
            build/graphics/voxelui-captures/*.ppm
            build/graphics/session-captures/*.ppm
            build/graphics/Testing/Temporary/LastTest.log
